    "fastcluster": {
      "Package": "fastcluster",
      "Version": "1.3.0",
      "Source": "Repository",
      "Encoding": "UTF-8",
      "Type": "Package",
      "Date": "2025-05-07",
      "Title": "Fast Hierarchical Clustering Routines for R and 'Python'",
      "Authors@R": "c(person(\"Daniel\", \"Müllner\", email = \"daniel@danifold.net\", role = c(\"aut\", \"cph\", \"cre\")), person(\"Google Inc.\", role=\"cph\"))",
